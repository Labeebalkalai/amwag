<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قائمة الطعام | مطعم أمواج الصياد</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@emran-alhaddad/saudi-riyal-font@1.0.0/dist/index.min.css">
</head>
<body>
    <header>
        <a href="index.html" class="logo">
            <img src="logo.png.jpeg" alt="أمواج الصياد" style="height: 50px;">
            أمواج الصياد
        </a>
        <div style="display: flex; gap: 1rem; align-items: center;">
            <nav>
                <ul>
                    <li><a href="index.html">الرئيسية</a></li>
                    <li><a href="menu.html" class="active">المنيو</a></li>
                    <li><a href="developer.html" target="_blank" style="color: var(--sandy-gold); font-weight: bold;"><i class="fas fa-code"></i> مطور الموقع</a></li>
                </ul>
            </nav>
            <div class="cart-icon" onclick="toggleCart()" style="position: relative; cursor: pointer; color: white; font-size: 1.5rem;">
                <i class="fas fa-shopping-cart"></i>
                <span id="cart-count" style="position: absolute; top: -10px; right: -10px; background: var(--sandy-gold); color: var(--deep-blue); width: 20px; height: 20px; border-radius: 50%; font-size: 0.8rem; display: flex; align-items: center; justify-content: center; font-weight: bold;">0</span>
            </div>
        </div>
    </header>

    <section>
        <h2 class="section-title">قائمة الطعام</h2>
        
        <!-- Category Filter -->
        <div style="display: flex; justify-content: center; gap: 1rem; margin-bottom: 3rem; flex-wrap: wrap;">
            <button class="filter-btn active" onclick="filterMenu('all')">الكل</button>
            <button class="filter-btn" onclick="filterMenu('soup')">شوربات</button>
            <button class="filter-btn" onclick="filterMenu('appetizer')">مقبلات</button>
            <button class="filter-btn" onclick="filterMenu('grilled')">قسم السمك</button>
            <button class="filter-btn" onclick="filterMenu('stew')">طواجن</button>
            <button class="filter-btn" onclick="filterMenu('traditional')">ماكولات شعبيه</button>
            <button class="filter-btn" onclick="filterMenu('drink')">مشروبات</button>
        </div>

        <div id="menu-grid" class="grid">
            <!-- Menu items will be injected by main.js -->
        </div>
    </section>

    <!-- Shopping Cart Sidebar (Hidden by default) -->
    <div id="cart-sidebar" style="display: flex; flex-direction: column; position: fixed; top: 0; left: -400px; width: 350px; max-width: 100vw; height: 100%; background: white; z-index: 2000; box-shadow: 2px 0 20px rgba(0,0,0,0.2); transition: 0.3s; color: var(--text-dark);">
        <div style="padding: 2rem 2rem 1rem 2rem; flex-shrink: 0;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h3>سلة الطلبات</h3>
                <i class="fas fa-times" onclick="toggleCart()" style="cursor: pointer;"></i>
            </div>
        </div>
        <div style="flex-grow: 1; overflow-y: auto; padding: 0 2rem;">
            <div id="cart-items" style="margin-bottom: 1.5rem;">
                <!-- Cart items here -->
            </div>
            <div style="margin-bottom: 1.5rem;">
            <div style="margin-bottom: 0.8rem;">
                <label style="font-size: 0.9rem; display: block; margin-bottom: 3px;">الاسم:</label>
                <input type="text" id="customer-name" placeholder="اسمك الكريم" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 5px;">
            </div>
            <div style="margin-bottom: 0.8rem;">
                <label style="font-size: 0.9rem; display: block; margin-bottom: 3px;">رقم الجوال:</label>
                <input type="tel" id="customer-phone" placeholder="05xxxxxxxx" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 5px;">
            </div>
            <div style="margin-bottom: 1rem;">
                <label style="font-size: 0.9rem; display: block; margin-bottom: 5px;">نوع الطلب:</label>
                <div style="display: flex; gap: 15px;">
                    <label style="font-size: 0.85rem;"><input type="radio" name="order-type" value="محلي" checked> محلي</label>
                    <label style="font-size: 0.85rem;"><input type="radio" name="order-type" value="سفري"> سفري</label>
                </div>
            </div>
            <div style="margin-bottom: 1.5rem;">
                <label style="font-size: 0.9rem; display: block; margin-bottom: 5px;">طريقة الدفع:</label>
                <div style="display: flex; gap: 15px;">
                    <label style="font-size: 0.85rem;"><input type="radio" name="payment-method" value="عند الاستلام" checked> عند الاستلام</label>
                    <label style="font-size: 0.85rem;"><input type="radio" name="payment-method" value="دفع إلكتروني"> دفع إلكتروني</label>
                </div>
            </div>
            <div style="margin-bottom: 1.5rem;">
                <label style="font-size: 0.9rem; display: block; margin-bottom: 5px;">ملاحظات إضافية:</label>
                <textarea id="order-notes" placeholder="مثلاً: بدون بصل، زيادة شطة..." style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 5px; height: 60px;"></textarea>
            </div>
            </div>
        </div>
        <div style="padding: 1.5rem 2rem; border-top: 1px solid #eee; flex-shrink: 0;">
            <div style="display: flex; justify-content: space-between; font-size: 1.2rem; font-weight: bold; margin-bottom: 1.5rem;">
                <span>الإجمالي:</span>
                <span><span id="cart-total">0</span> <span class="icon-saudi_riyal" style="font-size: 1.5rem;"></span></span>
            </div>
            <button onclick="checkout()" class="btn-primary" style="width: 100%; padding: 12px;">إتمام الطلب عبر واتساب</button>
        </div>
    </div>

    <!-- Electronic Payment Modal -->
    <div id="payment-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 3000;">
        <div style="background: white; padding: 2rem; border-radius: 15px; width: 400px; max-width: 90%; text-align: center;">
            <h3 style="margin-bottom: 1.5rem;">الدفع الإلكتروني</h3>
            <p style="margin-bottom: 1.5rem;">يرجى مسح الرمز لإتمام عملية الدفع:</p>
            <div style="background: #f8f9fa; padding: 2rem; margin-bottom: 1.5rem; border-radius: 10px;">
                <i class="fas fa-qrcode" style="font-size: 5rem; color: var(--deep-blue);"></i>
                <p style="margin-top: 1rem; font-weight: bold;">STC Pay / Mada</p>
            </div>
            <button class="btn-primary" style="width: 100%;" onclick="processPayment()">تم الدفع</button>
            <button style="width: 100%; margin-top: 0.5rem; border: none; background: none; color: #666; cursor: pointer;" onclick="closePaymentModal()">إلغاء</button>
        </div>
    </div>

    <footer style="margin-top: 5rem;">
        <p>&copy; 2024 مطعم أمواج الصياد. جميع الحقوق محفوظة.</p>
    </footer>

    <style>
        .filter-btn {
            background: #eee;
            border: none;
            padding: 0.6rem 1.5rem;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: 500;
        }
        .filter-btn.active {
            background: var(--ocean-blue);
            color: white;
        }
        .filter-btn:hover {
            background: var(--ocean-blue);
            color: white;
        }
        .add-to-cart {
            background: var(--ocean-blue);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            margin-top: 1rem;
        }
    </style>

    <script src="data.js"></script>
    <script src="main.js"></script>
    <script>
        // Local script to load menu items
        document.addEventListener('DOMContentLoaded', () => {
            renderMenu('all');
        });
    </script>
</body>
</html>
