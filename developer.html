<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مطور الموقع | أمواج الصياد</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, var(--deep-blue) 0%, var(--primary-blue) 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            padding: 2rem;
        }
        .dev-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 3rem;
            border-radius: 30px;
            text-align: center;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            animation: cardAppear 0.8s ease-out;
        }
        @keyframes cardAppear {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .profile-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 5px solid var(--sandy-gold);
            margin-bottom: 1.5rem;
            object-fit: cover;
        }
        .dev-name {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            color: var(--sandy-gold);
        }
        .dev-title {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            opacity: 0.9;
            letter-spacing: 1px;
        }
        .dev-bio {
            line-height: 1.8;
            margin-bottom: 2.5rem;
            font-size: 1.1rem;
        }
        .contact-links {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
        }
        .contact-links a {
            color: white;
            font-size: 1.8rem;
            transition: 0.3s;
        }
        .contact-links a:hover {
            color: var(--sandy-gold);
            transform: translateY(-5px);
        }
        .back-link {
            margin-top: 3rem;
            display: inline-block;
            color: white;
            text-decoration: none;
            font-size: 0.9rem;
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <div class="dev-card">
        <!-- صورة المطور -->
        <div style="margin: 0 auto 2rem; position: relative; width: 150px; height: 150px;">
            <img src="my_photoo.jpg.jpeg" alt="لبيب محفوظ الكلعي" 
                 style="width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 4px solid var(--sandy-gold); box-shadow: 0 10px 20px rgba(0,0,0,0.2);">
        </div>
        
        <h1 class="dev-name">لبيب محفوظ الكلعي</h1>
        <p class="dev-title">مطور تطبيقات ويب وواجهات مستخدم</p>
        
        <p class="dev-bio">
            أهلاً بك! أنا مطور هذا الموقع. متخصص في بناء الحلول الرقمية المبتكرة وتطوير المواقع الإلكترونية بأحدث التقنيات لضمان أفضل تجربة مستخدم.
        </p>

        <div class="contact-links">
            <a href="https://wa.me/966546117271" target="_blank"><i class="fab fa-whatsapp"></i></a>
            <a href="#"><i class="fab fa-linkedin"></i></a>
            <a href="#"><i class="fab fa-github"></i></a>
            <a href="mailto:example@email.com"><i class="fas fa-envelope"></i></a>
        </div>

        <a href="javascript:window.close()" class="back-link"><i class="fas fa-times"></i> إغلاق النافذة</a>
    </div>

</body>
</html>
